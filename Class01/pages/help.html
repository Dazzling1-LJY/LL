    <div class="help-section">
        <h3>关于系统</h3>
        <p>欢迎使用用户管理系统！本系统提供用户注册、登录、信息管理、头像上传、余额充值等功能。</p>
    </div>
    <div class="help-section">
        <h3>功能介绍</h3>
        <ul>
            <li><strong>注册：</strong>新用户可自助注册账号</li>
            <li><strong>登录：</strong>注册后使用用户名和密码登录</li>
            <li><strong>搜索：</strong>可按用户名或邮箱搜索其他用户</li>
            <li><strong>个人中心：</strong>查看个人信息和余额</li>
            <li><strong>充值：</strong>为账户充值余额</li>
            <li><strong>头像上传：</strong>上传个人头像</li>
        </ul>
    </div>
    <div class="help-section">
        <h3>常见问题</h3>
        <p><strong>Q: 忘记密码怎么办？</strong></p>
        <p>A: 请联系管理员重置密码。</p>
        <p><strong>Q: 充值后余额未更新？</strong></p>
        <p>A: 请刷新页面或重新登录查看。</p>
