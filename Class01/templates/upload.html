{% extends "base.html" %}
{% block content %}
<div class="card login-card">
    <h2>上传头像</h2>

    {% if success %}
    <div class="success-message">{{ success }}</div>
    <div class="upload-preview">
        <img src="{{ file_url }}" alt="头像预览" class="avatar-preview">
        <p class="upload-file-info">文件名：{{ filename }}</p>
        <p class="upload-file-info">访问 URL：<a href="{{ file_url }}" target="_blank">{{ file_url }}</a></p>
    </div>
    <a href="/upload" class="btn" style="margin-top: 12px;">继续上传</a>
    <a href="/" class="btn" style="margin-top: 12px; margin-left: 8px;">返回首页</a>
    {% else %}
    <form method="post" action="/upload" enctype="multipart/form-data">
        <div class="form-group">
            <label for="avatar">选择头像文件</label>
            <input type="file" id="avatar" name="avatar" class="form-input file-input" required>
        </div>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn">上传</button>
    </form>
    {% endif %}
</div>
{% endblock %}
