{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Ping 网络诊断</h2>
    <form method="post" action="/ping" class="ping-form">
        <div class="form-group">
            <label for="ip">IP 地址 / 域名</label>
            <div class="ping-input-group">
                <input type="text" id="ip" name="ip" class="form-input ping-input" placeholder="例如：114.114.114.114" value="{{ ip }}" required>
                <button type="submit" class="btn btn-ping">Ping</button>
            </div>
        </div>
    </form>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    {% if result %}
    <div class="ping-result">
        <div class="ping-result-header">Ping 结果：</div>
        <pre class="ping-console">{{ result }}</pre>
    </div>
    {% endif %}
</div>
{% endblock %}
